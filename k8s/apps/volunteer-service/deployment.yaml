apiVersion: apps/v1
kind: Deployment
metadata:
  name: volunteer-service
  namespace: volunteer-service
  labels:
    app: volunteer-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: volunteer-service
  template:
    metadata:
      labels:
        app: volunteer-service
    spec:
      imagePullSecrets:
        - name: ecr-pull-secret
      containers:
        - name: volunteer-service
          image: 273095550978.dkr.ecr.us-east-1.amazonaws.com/solidarytech-volunteer:v1.0.0-43c3865
          imagePullPolicy: Always
          ports:
            - containerPort: 8083
          envFrom:
            - configMapRef:
                name: volunteer-service-config
            - secretRef:
                name: volunteer-service-secret
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "otel-collector.monitoring.svc.cluster.local:4317"
            - name: OTEL_EXPORTER_OTLP_INSECURE
              value: "true"
            - name: OTEL_SERVICE_NAME
              value: "volunteer-service"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "namespace=volunteer-service"
            - name: OTEL_METRICS_EXPORTER
              value: "otlp"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8083
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8083
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
