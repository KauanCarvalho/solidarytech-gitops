apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: volunteer-service-secret
  namespace: volunteer-service
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: aws-cluster-secret-store
    kind: ClusterSecretStore
  target:
    name: volunteer-service-secret
    creationPolicy: Owner
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: solidarytech/volunteer/access_key
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: solidarytech/volunteer/secret_key
    - secretKey: AWS_SESSION_TOKEN
      remoteRef:
        key: solidarytech/volunteer/session_token
