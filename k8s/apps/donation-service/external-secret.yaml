apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: donation-service-secret
  namespace: donation-service
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: aws-cluster-secret-store
    kind: ClusterSecretStore
  target:
    name: donation-service-secret
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: solidarytech/donation/db_url
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: solidarytech/donation/access_key
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: solidarytech/donation/secret_key
    - secretKey: AWS_SESSION_TOKEN
      remoteRef:
        key: solidarytech/donation/session_token
    - secretKey: AWS_SQS_URL
      remoteRef:
        key: solidarytech/donation/sqs_url
