apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ngo-service-secret
  namespace: ngo-service
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: aws-cluster-secret-store
    kind: ClusterSecretStore
  target:
    name: ngo-service-secret
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: solidarytech/ngo/db_url
