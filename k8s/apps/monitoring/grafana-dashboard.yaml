---
# Dashboard SolidaryTech — Grafana ConfigMap
# Será carregado automaticamente pelo sidecar do Grafana
apiVersion: v1
kind: ConfigMap
metadata:
  name: solidarytech-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  solidarytech.json: |
    {
      "title": "SolidaryTech — Ecosystem Health",
      "uid": "solidarytech-health",
      "timezone": "browser",
      "refresh": "30s",
      "schemaVersion": 38,
      "tags": ["solidarytech", "hackathon-fase5"],
      "panels": [
        {
          "id": 1,
          "title": "🟢 Pods Running por Serviço",
          "type": "stat",
          "gridPos": {"x": 0, "y": 0, "w": 24, "h": 4},
          "targets": [
            {
              "expr": "kube_deployment_status_replicas_available{namespace=~\"ngo-service|donation-service|volunteer-service\"}",
              "legendFormat": "{{namespace}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "thresholds"},
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "red", "value": 0},
                  {"color": "yellow", "value": 1},
                  {"color": "green", "value": 2}
                ]
              }
            }
          }
        },
        {
          "id": 2,
          "title": "📈 Taxa de Requisições (req/s)",
          "type": "timeseries",
          "gridPos": {"x": 0, "y": 4, "w": 12, "h": 8},
          "targets": [
            {
              "expr": "sum(rate(http_requests_total[5m])) by (namespace)",
              "legendFormat": "{{namespace}}"
            }
          ]
        },
        {
          "id": 3,
          "title": "❌ Taxa de Erros 5xx (%)",
          "type": "timeseries",
          "gridPos": {"x": 12, "y": 4, "w": 12, "h": 8},
          "targets": [
            {
              "expr": "(sum(rate(http_requests_total{status=~\"5..\"}[5m])) by (namespace) or sum(rate(http_requests_total[5m])) by (namespace) * 0) / sum(rate(http_requests_total[5m])) by (namespace) * 100",
              "legendFormat": "{{namespace}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "color": {"mode": "palette-classic"},
              "custom": {
                "thresholdsStyle": {"mode": "line+area"}
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "green", "value": 0},
                  {"color": "red", "value": 5}
                ]
              }
            }
          }
        },
        {
          "id": 4,
          "title": "⚡ CPU Usage por Node (%)",
          "type": "timeseries",
          "gridPos": {"x": 0, "y": 12, "w": 12, "h": 8},
          "targets": [
            {
              "expr": "(1 - avg(rate(node_cpu_seconds_total{mode='idle'}[5m])) by (instance)) * 100",
              "legendFormat": "{{instance}}"
            }
          ],
          "fieldConfig": {"defaults": {"unit": "percent"}}
        },
        {
          "id": 5,
          "title": "🧠 Memory Usage por Node (%)",
          "type": "timeseries",
          "gridPos": {"x": 12, "y": 12, "w": 12, "h": 8},
          "targets": [
            {
              "expr": "(1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100",
              "legendFormat": "{{instance}}"
            }
          ],
          "fieldConfig": {"defaults": {"unit": "percent"}}
        },
        {
          "id": 6,
          "title": "📋 Logs em Tempo Real (Loki)",
          "type": "logs",
          "gridPos": {"x": 0, "y": 20, "w": 24, "h": 10},
          "datasource": {"type": "loki", "uid": "loki"},
          "targets": [
            {
              "expr": "{namespace=~\"ngo-service|donation-service|volunteer-service\"}",
              "legendFormat": ""
            }
          ],
          "options": {
            "showTime": true,
            "showLabels": true,
            "wrapLogMessage": false,
            "sortOrder": "Descending",
            "dedupStrategy": "none"
          }
        },
        {
          "id": 7,
          "title": "⏱ Latência p95 por Serviço (ms)",
          "type": "timeseries",
          "gridPos": {"x": 0, "y": 30, "w": 24, "h": 8},
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le, namespace)) * 1000",
              "legendFormat": "p95 {{namespace}}"
            }
          ],
          "fieldConfig": {"defaults": {"unit": "ms"}}
        }
      ]
    }
