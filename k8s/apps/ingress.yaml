apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: solidarytech-ingress
  namespace: donation-service
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          # Todas as rotas dos 3 serviços já incluem o próprio prefixo
          # internamente (/ngos, /donations, /volunteers), então nenhum
          # rewrite é necessário — diferente do ToggleMaster.
          - path: /ngos
            pathType: Prefix
            backend:
              service:
                name: ngo-service-ext
                port:
                  number: 80
          - path: /donations
            pathType: Prefix
            backend:
              service:
                name: donation-service
                port:
                  number: 80
          - path: /volunteers
            pathType: Prefix
            backend:
              service:
                name: volunteer-service-ext
                port:
                  number: 80
---
apiVersion: v1
kind: Service
metadata:
  name: ngo-service-ext
  namespace: donation-service
spec:
  type: ExternalName
  externalName: ngo-service.ngo-service.svc.cluster.local
---
apiVersion: v1
kind: Service
metadata:
  name: volunteer-service-ext
  namespace: donation-service
spec:
  type: ExternalName
  externalName: volunteer-service.volunteer-service.svc.cluster.local
