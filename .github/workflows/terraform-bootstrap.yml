name: Terraform Bootstrap

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Terraform action to run"
        required: true
        default: "plan"
        type: choice
        options:
          - plan
          - apply

env:
  TF_VERSION: "1.9.8"
  WORKING_DIR: terraform/bootstrap
  AWS_REGION: us-east-1
  TF_CLI_ARGS: "-no-color"

jobs:
  terraform-plan:
    name: "Terraform Plan"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install Terraform manually
        run: |
          TF_VERSION="1.9.8"
          curl -fsSL "https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_amd64.zip" -o terraform.zip
          unzip terraform.zip
          sudo mv terraform /usr/local/bin/terraform
          terraform version

      - name: Refresh HashiCorp GPG key
        run: |
          wget -O- https://apt.releases.hashicorp.com/gpg | gpg --import
          mkdir -p ~/.terraform.d/plugin-cache

      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check -recursive

      - name: Run tfsec (policy-as-code security scan)
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: ${{ env.WORKING_DIR }}
          soft_fail: false

      - name: Terraform Init
        id: init
        run: terraform init
        env:
          TF_VAR_aws_region: ${{ env.AWS_REGION }}

      - name: Terraform Validate
        id: validate
        run: terraform validate

      - name: Terraform Plan
        id: plan
        run: terraform plan -out=tfplan
        env:
          TF_VAR_aws_region: ${{ env.AWS_REGION }}

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: ${{ env.WORKING_DIR }}/tfplan
          retention-days: 1

  terraform-apply:
    name: "Terraform Apply"
    runs-on: ubuntu-latest
    needs: terraform-plan
    if: |
      github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply'
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    environment:
      name: bootstrap
      url: https://console.aws.amazon.com/s3/

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install Terraform manually
        run: |
          TF_VERSION="1.9.8"
          curl -fsSL "https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_amd64.zip" -o terraform.zip
          unzip terraform.zip
          sudo mv terraform /usr/local/bin/terraform
          terraform version

      - name: Refresh HashiCorp GPG key
        run: |
          wget -O- https://apt.releases.hashicorp.com/gpg | gpg --import
          mkdir -p ~/.terraform.d/plugin-cache

      - name: Terraform Init
        run: terraform init
        env:
          TF_VAR_aws_region: ${{ env.AWS_REGION }}

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: ${{ env.WORKING_DIR }}

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan

      - name: Show Outputs
        run: terraform output

      - name: Post Apply Summary
        if: success()
        run: |
          echo "## Bootstrap Applied Successfully" >> $GITHUB_STEP_SUMMARY
          echo "- **S3 Bucket**: \`$(terraform output -raw state_bucket_id 2>/dev/null || echo 'N/A')\`" >> $GITHUB_STEP_SUMMARY
          echo "- **DynamoDB Table**: \`$(terraform output -raw lock_table_name 2>/dev/null || echo 'N/A')\`" >> $GITHUB_STEP_SUMMARY
