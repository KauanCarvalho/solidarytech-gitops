name: Terraform Production

on:
  pull_request:
    branches:
      - main
    paths:
      - "terraform/production/**"
  workflow_dispatch:
    inputs:
      action:
        description: "Terraform action to run"
        required: true
        default: "plan"
        type: choice
        options:
          - plan
          - apply
          - destroy

env:
  TF_VERSION: "1.9.8"
  WORKING_DIR: terraform/production
  AWS_REGION: us-east-1
  TF_VAR_db_password_ngo: ${{ secrets.DB_PASSWORD_NGO }}
  TF_VAR_db_password_donation: ${{ secrets.DB_PASSWORD_DONATION }}
  TF_VAR_aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
  TF_VAR_aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  TF_VAR_aws_session_token: ${{ secrets.AWS_SESSION_TOKEN }}
  TF_VAR_datadog_api_key: ${{ secrets.DATADOG_API_KEY }}
  TF_VAR_datadog_app_key: ${{ secrets.DATADOG_APP_KEY }}
  TF_VAR_discord_webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
  TF_VAR_pagerduty_integration_key: ${{ secrets.PAGERDUTY_INTEGRATION_KEY }}
  TF_VAR_github_dispatch_token: ${{ secrets.GH_DISPATCH_TOKEN }}
  TF_VAR_self_healing_webhook_token: ${{ secrets.SELF_HEALING_WEBHOOK_TOKEN }}

jobs:
  terraform-plan:
    name: "Terraform Plan"
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'plan') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply')
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check -recursive

      - name: Run tfsec (policy-as-code security scan)
        id: tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: ${{ env.WORKING_DIR }}
          soft_fail: false

      - name: Terraform Init
        id: init
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          BUCKET_NAME="solidarytech-terraform-state-${ACCOUNT_ID}"
          terraform init -input=false \
            -backend-config="bucket=${BUCKET_NAME}" \
            -backend-config="key=production/terraform.tfstate" \
            -backend-config="region=us-east-1" \
            -backend-config="dynamodb_table=solidarytech-terraform-state-lock" \
            -backend-config="encrypt=true"

      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color

      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color -out=tfplan
        env:
          TF_VAR_aws_region: ${{ env.AWS_REGION }}

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: prod-tfplan
          path: ${{ env.WORKING_DIR }}/tfplan
          retention-days: 1

      - name: Post Plan Summary
        if: always()
        run: |
          echo "## Terraform Production — Plan" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Step     | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Format   | ${{ steps.fmt.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| tfsec    | ${{ steps.tfsec.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Init     | ${{ steps.init.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Validate | ${{ steps.validate.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Plan     | ${{ steps.plan.outcome }} |" >> $GITHUB_STEP_SUMMARY

  terraform-apply:
    name: "Terraform Apply"
    runs-on: ubuntu-latest
    needs: terraform-plan
    if: |
      github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply'
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    environment:
      name: production
      url: https://console.aws.amazon.com/ecr/

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          BUCKET_NAME="solidarytech-terraform-state-${ACCOUNT_ID}"
          terraform init -input=false \
            -backend-config="bucket=${BUCKET_NAME}" \
            -backend-config="key=production/terraform.tfstate" \
            -backend-config="region=us-east-1" \
            -backend-config="dynamodb_table=solidarytech-terraform-state-lock" \
            -backend-config="encrypt=true"

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: prod-tfplan
          path: ${{ env.WORKING_DIR }}

      - name: Rebuild self-healing lambda zip
        # O archive_file (data source) gera este zip como efeito colateral do
        # "terraform plan", rodado num runner diferente do apply — o arquivo
        # em si não viaja no plan artifact, só o hash/plano. Sem isto, o
        # apply falha com "no such file or directory" ao tentar ler o zip.
        run: zip -j lambda/self-healing/main.zip lambda/self-healing/main.py

      - name: Terraform Apply
        run: terraform apply -no-color -auto-approve tfplan

      - name: Show Outputs
        run: terraform output -no-color

      - name: Post Apply Summary
        if: success()
        run: |
          echo "## Production Applied Successfully" >> $GITHUB_STEP_SUMMARY

  terraform-destroy:
    name: "Terraform Destroy"
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'destroy'
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    environment:
      name: production-destroy

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          BUCKET_NAME="solidarytech-terraform-state-${ACCOUNT_ID}"
          terraform init -input=false \
            -backend-config="bucket=${BUCKET_NAME}" \
            -backend-config="key=production/terraform.tfstate" \
            -backend-config="region=us-east-1" \
            -backend-config="dynamodb_table=solidarytech-terraform-state-lock" \
            -backend-config="encrypt=true"

      - name: Terraform Destroy
        run: terraform destroy -no-color -auto-approve
