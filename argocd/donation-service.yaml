apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: donation-service
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/KauanCarvalho/solidarytech-gitops.git
    targetRevision: main
    path: k8s/apps/donation-service
  destination:
    server: https://kubernetes.default.svc
    namespace: donation-service
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
